<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>เช็คอินงานแม่บ้าน</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root { --g:#1E8449; --g2:#27AE60; --r:#C0392B; --o:#E67E22; --ink:#1d2b24; --mute:#6b7a72; --bg:#F3F7F4; --card:#fff; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:'Sarabun',sans-serif; background:var(--bg); color:var(--ink); font-size:18px; }
  .wrap { max-width:480px; margin:0 auto; padding:16px 16px 40px; }
  .card { background:var(--card); border-radius:16px; padding:18px; box-shadow:0 1px 4px #0001; margin-bottom:14px; }
  h1 { font-size:22px; margin:4px 0 2px; color:var(--g); }
  .who { font-size:24px; font-weight:700; }
  .mute { color:var(--mute); font-size:15px; }
  .clock { font-size:52px; font-weight:700; text-align:center; letter-spacing:1px; margin:6px 0 0; }
  .date { text-align:center; color:var(--mute); }
  .btn { display:block; width:100%; border:0; border-radius:14px; padding:22px 12px; font:700 24px 'Sarabun',sans-serif;
         color:#fff; margin:12px 0; cursor:pointer; }
  .btn small { display:block; font-size:15px; font-weight:400; opacity:.9; }
  .in { background:var(--g2); } .out { background:#2E86C1; } .sec { background:#e8eeea; color:var(--ink); font-size:18px; padding:14px; }
  .btn:disabled { opacity:.5; }
  .rec { display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid #eee; font-size:17px; }
  .rec:last-child { border-bottom:0; }
  .tag { padding:2px 10px; border-radius:10px; font-size:14px; color:#fff; white-space:nowrap; }
  .ok { background:var(--g2); } .warn { background:var(--o); } .bad { background:var(--r); }
  select { width:100%; font:600 20px 'Sarabun',sans-serif; padding:12px; border-radius:10px; border:2px solid #cfd8d3; background:#fff; }
  .big { font-size:72px; text-align:center; line-height:1; margin:10px 0; }
  .center { text-align:center; }
  .hide { display:none; }
  .err { color:var(--r); font-weight:600; }
  .spin { width:46px; height:46px; border:5px solid #d5e5db; border-top-color:var(--g2); border-radius:50%;
          animation:s 1s linear infinite; margin:18px auto; }
  @keyframes s { to { transform:rotate(360deg); } }
  img.prev { width:100%; border-radius:12px; margin-top:8px; }
</style>
</head>
<body>
<div class="wrap">

  <!-- กำลังโหลด / กำลังส่ง -->
  <div id="busy" class="card center"><div class="spin"></div><div id="busyText">กำลังโหลด...</div></div>

  <!-- เลือกชื่อ -->
  <div id="pick" class="card hide">
    <h1>เลือกชื่อของคุณ</h1>
    <p class="mute" id="pickHint">ทำครั้งเดียว ระบบจะจำชื่อนี้กับบัญชีไลน์ของคุณ</p>
    <select id="people"></select>
    <button class="btn in" id="pickOk">ยืนยันชื่อ</button>
  </div>

  <!-- หน้าหลัก -->
  <div id="main" class="hide">
    <div class="card">
      <div class="mute">เช็คอินงานแม่บ้าน</div>
      <div class="who" id="who"></div>
      <div class="clock" id="clock">--:--</div>
      <div class="date" id="today"></div>
      <div class="mute center" id="hours"></div>
    </div>
    <button class="btn in" id="btnIn">☀️ เช็คอินเข้างาน<small>ถ่ายรูปตัวเอง 1 รูป</small></button>
    <button class="btn out" id="btnOut">🌙 เช็คเอาต์เลิกงาน<small>ถ่ายรูปตัวเอง 1 รูป</small></button>
    <button class="btn sec hide" id="btnChange">เปลี่ยนชื่อ (มือถือใช้ร่วมกัน)</button>
    <div class="card">
      <b>วันนี้</b>
      <div id="records"><div class="mute">ยังไม่มีการเช็คอิน</div></div>
    </div>
  </div>

  <!-- ผลลัพธ์ -->
  <div id="done" class="card center hide">
    <div class="big" id="doneIcon">✅</div>
    <div class="who" id="doneTitle"></div>
    <div class="clock" id="doneTime"></div>
    <p id="doneStatus"></p>
    <p id="doneZone" class="mute"></p>
    <img id="donePhoto" class="prev hide" alt="">
    <button class="btn sec" id="btnBack">กลับหน้าหลัก</button>
    <button class="btn in" id="btnClose">ปิด</button>
  </div>

  <div id="error" class="card hide"><p class="err" id="errText"></p><button class="btn sec" onclick="location.reload()">ลองใหม่</button></div>

  <input type="file" id="cam" accept="image/*" capture="user" class="hide">
</div>

<script>
/* ====== ตั้งค่า: แก้ 2 บรรทัดนี้ ====== */
const LIFF_ID = '2012056844-sHmuNPI4';
const GAS_URL = 'https://script.google.com/macros/s/AKfycbxpeHY4U4IBpea-wkP3dUO-Mij1kL6Yn8ywx3k9FxTjZptR0wFpNjjZAN8p-zcTN_M6Og/exec';
/* ==================================== */

const $ = id => document.getElementById(id);
let idToken = '', state = {}, pending = '', person = '';
function show(id) { ['busy','pick','main','done','error'].forEach(x => $(x).classList.toggle('hide', x !== id)); }
function busy(t) { $('busyText').textContent = t; show('busy'); }
function fail(t) { $('errText').textContent = t; show('error'); }
const shortName = p => (p || '').replace(/^\d+/, '');
const tagClass = s => /สาย|กลับก่อน|ไม่ใช่|ไม่มีพิกัด/.test(s) ? 'warn' : 'ok';

async function api(data) {
  const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify(Object.assign({ idToken }, data)) });
  return res.json();
}

function tick() {
  const d = new Date();
  $('clock').textContent = d.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });
  $('today').textContent = d.toLocaleDateString('th-TH', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
}

function renderMain() {
  $('who').textContent = shortName(person) || '-';
  $('hours').textContent = 'เวลางาน ' + (state.start || '') + ' – ' + (state.end || '') + ' น.';
  $('btnChange').classList.toggle('hide', !state.shared);
  const recs = state.today || [];
  $('records').innerHTML = recs.length ? recs.map(r =>
    `<div class="rec"><span>${r.type === 'เข้า' ? '☀️ เข้างาน' : '🌙 เลิกงาน'} ${r.time} น.</span>
     <span class="tag ${tagClass(r.status + r.inZone)}">${r.status}${r.inZone === 'ไม่ใช่' ? ' · นอกพื้นที่' : ''}</span></div>`).join('')
    : '<div class="mute">ยังไม่มีการเช็คอิน</div>';
  show('main');
}

function showPick(people, hint) {
  $('people').innerHTML = '<option value="">— แตะเพื่อเลือกชื่อ —</option>' +
    people.map(p => `<option value="${p}" ${p === person ? 'selected' : ''}>${shortName(p)}</option>`).join('');
  if (hint) $('pickHint').textContent = hint;
  show('pick');
}

async function loadStatus() {
  busy('กำลังโหลด...');
  const r = await api({ action: 'status', person });
  if (!r.ok) return fail(r.error || 'เกิดข้อผิดพลาด');
  state = r;
  if (r.needPick) return showPick(r.people, r.shared ? 'มือถือเครื่องนี้ใช้ร่วมกัน กรุณาเลือกชื่อทุกครั้ง' : null);
  person = r.person;
  renderMain();
}

/* ---------- ถ่ายรูป -> หาพิกัด -> ส่ง ---------- */
function getLocation() {
  return new Promise(resolve => {
    if (!navigator.geolocation) return resolve(null);
    navigator.geolocation.getCurrentPosition(
      p => resolve({ lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy }),
      () => resolve(null), { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 });
  });
}
function shrink(file) {
  return new Promise((resolve, reject) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const max = 800, k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); resolve(c.toDataURL('image/jpeg', 0.7));
    };
    img.onerror = reject; img.src = url;
  });
}
function start(type) { pending = type; $('cam').value = ''; $('cam').click(); }

$('cam').addEventListener('change', async e => {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  try {
    busy('กำลังหาตำแหน่ง GPS...');
    const [loc, photo] = await Promise.all([getLocation(), shrink(file)]);
    busy('กำลังบันทึก...');
    const r = await api({ action: 'checkin', type: pending, person,
                          lat: loc ? loc.lat : null, lng: loc ? loc.lng : null, acc: loc ? loc.acc : null, photo });
    if (r.needPick) { state.shared = true; return showPick(r.people); }
    if (!r.ok) return fail(r.error || 'บันทึกไม่สำเร็จ');
    state.today = r.today;
    $('doneIcon').textContent = /สาย|กลับก่อน/.test(r.status) || r.inZone === 'ไม่ใช่' ? '⚠️' : '✅';
    $('doneTitle').textContent = (r.type === 'เข้า' ? 'เช็คอินเข้างาน' : 'เช็คเอาต์เลิกงาน') + ' — ' + shortName(r.person);
    $('doneTime').textContent = r.time + ' น.';
    $('doneStatus').innerHTML = `<span class="tag ${tagClass(r.status)}" style="font-size:18px">${r.status}</span>`;
    $('doneZone').textContent =
      r.inZone === 'ใช่' ? '📍 อยู่ในพื้นที่มหาวิทยาลัย' :
      r.inZone === 'ไม่ใช่' ? '📍 อยู่นอกพื้นที่ (ห่างประมาณ ' + r.dist + ' ม.) — ระบบบันทึกไว้แล้ว' :
      r.inZone === 'ไม่มีพิกัด' ? '📍 ไม่ได้พิกัด GPS — กรุณาเปิด Location ครั้งหน้า' : '';
    $('donePhoto').src = photo; $('donePhoto').classList.remove('hide');
    show('done');
  } catch (err) { fail('เกิดข้อผิดพลาด: ' + err.message); }
});

$('btnIn').onclick = () => start('in');
$('btnOut').onclick = () => start('out');
$('btnChange').onclick = () => showPick(state.people || [], 'เลือกชื่อคนที่จะเช็คอิน');
$('btnBack').onclick = () => renderMain();
$('btnClose').onclick = () => liff.isInClient() ? liff.closeWindow() : renderMain();
$('pickOk').onclick = async () => {
  const p = $('people').value;
  if (!p) return alertBox();
  if (!confirm('ยืนยันว่าคุณคือ "' + shortName(p) + '" ?')) return;
  person = p; state.needPick = false; await loadStatus();
};
function alertBox() { $('people').style.borderColor = '#C0392B'; }

(async () => {
  try {
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) return liff.login();
    idToken = liff.getIDToken();
    if (!idToken) return fail('ไม่ได้รับสิทธิ์ยืนยันตัวตน (ต้องเปิดสิทธิ์ openid ใน LIFF)');
    tick(); setInterval(tick, 10000);
    await loadStatus();
  } catch (err) { fail('เปิดหน้าเช็คอินไม่สำเร็จ: ' + err.message + ' — กรุณาเปิดผ่านแอป LINE'); }
})();
</script>
</body>
</html>
